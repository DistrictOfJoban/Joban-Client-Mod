name: CF Probe

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Probe note'
        required: false
        default: ''

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe round 4 - version type groups
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "=== full version-types list ==="
          curl -sS --max-time 30 -H "X-Api-Token: $CF_TOKEN" \
            "https://minecraft.curseforge.com/api/game/version-types" -o /tmp/vt.json
          cat /tmp/vt.json; echo; echo

          echo "=== versions grouped by type (non-Minecraft families) ==="
          curl -sS --max-time 60 -H "X-Api-Token: $CF_TOKEN" \
            "https://minecraft.curseforge.com/api/game/versions" -o /tmp/vs.json
          python3 - <<'PYEOF'
          import json
          types = {t['id']: t['name'] for t in json.load(open('/tmp/vt.json'))}
          vers = json.load(open('/tmp/vs.json'))
          groups = {}
          for v in vers:
              groups.setdefault(v['gameVersionTypeID'], []).append(v)
          for tid, items in sorted(groups.items()):
              tname = types.get(tid, f'UNKNOWN-{tid}')
              # skip big Minecraft version families, but show small metadata groups fully
              if len(items) > 40:
                  print(f"type {tid} ({tname}): {len(items)} versions (MC family, skipped)")
                  continue
              print(f"type {tid} ({tname}):")
              for v in items:
                  print(f"    id={v['id']} name={v['name']!r} slug={v.get('slug')}")
          PYEOF
