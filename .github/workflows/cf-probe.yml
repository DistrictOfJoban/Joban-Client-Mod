name: CF Probe

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Probe note'
        required: false
        default: ''

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CurseForge files are live
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          echo "=== V1: legacy API project files list ==="
          curl -sS --max-time 30 -o /tmp/v1.json -w "HTTP %{http_code} | %{size_download}B\n" \
            -H "X-Api-Token: $CF_TOKEN" "https://minecraft.curseforge.com/api/projects/1736483/files"
          head -c 600 /tmp/v1.json; echo; echo

          echo "=== V2: modern CurseForge website project files page ==="
          curl -sSL --max-time 60 -o /tmp/v2.html -w "HTTP %{http_code} | final %{url_effective} | %{size_download}B\n" \
            -A "$UA" "https://www.curseforge.com/minecraft/mc-mods/joban-client-mod-yanyang/files"
          echo "--- JCM file names found in page ---"
          grep -oE 'JCM-(fabric|forge)-2\.3\.0-beta-2\.yanyang\.4\+[0-9.]+\.jar' /tmp/v2.html | sort -u
          echo "--- version tags seen near files ---"
          grep -oE '"gameVersions?":\[[^]]*\]' /tmp/v2.html | head -15 || true

          echo "=== V3: legacy website project page ==="
          curl -sSL --max-time 60 -o /tmp/v3.html -w "HTTP %{http_code} | final %{url_effective} | %{size_download}B\n" \
            -A "$UA" "https://minecraft.curseforge.com/projects/joban-client-mod-yanyang/files"
          grep -oE 'JCM-(fabric|forge)-2\.3\.0-beta-2\.yanyang\.4\+[0-9.]+\.jar' /tmp/v3.html | sort -u | head -15 || echo "(no names found)"
