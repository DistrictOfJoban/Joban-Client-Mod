name: CF Probe

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Probe note'
        required: false
        default: ''

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CurseForge endpoints round 3
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "dummy-content" > /tmp/dummy.jar
          META='{"changelog":"probe","changelogType":"markdown","releaseType":"beta","gameVersions":[9994],"displayName":"probe"}'

          echo "=== P1: legacy GET /api/projects/1736483 (own project, X-Api-Token) ==="
          curl -sS --max-time 30 -o /tmp/p1.json -w "HTTP %{http_code} | %{size_download}B\n" \
            -H "X-Api-Token: $CF_TOKEN" "https://minecraft.curseforge.com/api/projects/1736483"
          head -c 500 /tmp/p1.json; echo; echo

          echo "=== P2: legacy POST /api/projects/266707/upload-file (MTR, expect permission error) ==="
          curl -sS --max-time 60 -o /tmp/p2.json -w "HTTP %{http_code}\n" -X POST \
            -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=$META" \
            -F "file=@/tmp/dummy.jar" \
            "https://minecraft.curseforge.com/api/projects/266707/upload-file"
          head -c 500 /tmp/p2.json; echo; echo

          echo "=== P3: new upload API POST /v1/minecraft/mods/266707/upload (full metadata, X-Api-Key) ==="
          curl -sS --max-time 60 -o /tmp/p3.json -w "HTTP %{http_code}\n" -X POST \
            -H "X-Api-Key: $CF_TOKEN" \
            -F "metadata=$META" \
            -F "file=@/tmp/dummy.jar" \
            "https://upload.curseforge.com/v1/minecraft/mods/266707/upload"
          head -c 500 /tmp/p3.json; echo; echo

          echo "=== P4: new upload API POST with X-Api-Token header variant ==="
          curl -sS --max-time 60 -o /tmp/p4.json -w "HTTP %{http_code}\n" -X POST \
            -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=$META" \
            -F "file=@/tmp/dummy.jar" \
            "https://upload.curseforge.com/v1/minecraft/mods/266707/upload"
          head -c 500 /tmp/p4.json; echo
