name: Release Build
on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Release type
        required: true
        options: [beta, release]
      publish-tag:
        type: string
        required: true
        description: Version without the v prefix
permissions:
  contents: read
jobs:
  model-upload:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real MTR model upload and GL state restoration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p native/build-gl
          curl --fail --location --retry 3 'https://api.modrinth.com/maven/maven/modrinth/minecraft-transit-railway/FABRIC-4.0.5+1.20.1/minecraft-transit-railway-FABRIC-4.0.5+1.20.1.jar' -o native/build-gl/mtr.jar
          xvfb-run -a python3 native/bench/model_upload_test.py --mtr-jar native/build-gl/mtr.jar --work native/build-gl/test
  natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            java-arch: x64
          - os: windows-latest
            platform: windows-x64
            java-arch: x64
          - os: macos-15-intel
            platform: macos-x64
            java-arch: x64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: macos-latest
            platform: macos-arm64
            java-arch: aarch64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          architecture: ${{ matrix.java-arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build CMake targets
        shell: bash
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-arch }}
          cmake --build native/build --config Release --parallel 4
      - name: Verify scripts, ABI layout and real JVM JNI integration
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Collect bridge and generic example libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/bridges/${{ matrix.platform }}" "dist/examples/${{ matrix.platform }}"
          find native/build -type f \( -name '*jcm_native_bridge.dll' -o -name '*jcm_native_bridge.so' -o -name '*jcm_native_bridge.dylib' \) -exec cp {} "dist/bridges/${{ matrix.platform }}/" \;
          for module in pids_arrivals eyecandy_signal lift_indicator; do
            find native/build -type f \( -name "$module.dll" -o -name "lib$module.so" -o -name "lib$module.dylib" \) -exec cp {} "dist/examples/${{ matrix.platform }}/" \;
          done
          test "$(find dist/bridges -type f | wc -l | tr -d ' ')" = 1
          test "$(find dist/examples -type f | wc -l | tr -d ' ')" = 3
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  build:
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        minecraft: [1.17.1, 1.18.2, 1.19.2, 1.19.4, 1.20.1, 1.20.4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
      - name: Build both loaders with all four JNI bridges
        run: |
          chmod +x ./gradlew
          ./gradlew setupFiles -Pminecraft_version="${{ matrix.minecraft }}" --console=plain
          ./gradlew build -Pminecraft_version="${{ matrix.minecraft }}" -Pmod_version="${{ inputs.publish-tag }}" -Pnative_bridge_dir=native-dist/bridges --console=plain
      - name: Audit documented Java API declarations
        run: |
          find .gradle ~/.gradle -name '*4.0.5*.jar' -type f > native/build-api-jars.txt
          python3 - <<'PY'
          from pathlib import Path
          import sys, json
          sys.path.insert(0,'native/bench')
          from api_coverage import audit
          jars=[Path(line) for line in Path('native/build-api-jars.txt').read_text().splitlines()]
          manifest=json.loads(Path('native/bench/api-coverage.json').read_text())
          for loader in ('fabric','forge'):
              audit(Path(loader+'/build/classes/java/main'),jars,manifest)
          PY
      - name: Verify jar contents and absence of user resource packs
        run: python3 native/bench/verify_jar.py --version "${{ inputs.publish-tag }}" build/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.minecraft }}
          path: build/*.jar
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [build, model-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: release-jars
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
      - name: Require all twelve jars and package a separate SDK
        run: |
          test "$(find release-jars -name '*.jar' -type f | wc -l)" -eq 12
          python3 - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files','native'],text=True).splitlines()
          with zipfile.ZipFile('jcm-native-sdk-${{ inputs.publish-tag }}.zip','w',zipfile.ZIP_DEFLATED) as archive:
              archive.write('LICENSE')
              for name in files:
                  path=Path(name)
                  if path.is_file(): archive.write(path,path)
              for path in Path('native-dist/examples').rglob('*'):
                  if path.is_file(): archive.write(path,path.relative_to('native-dist'))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.publish-tag }}
          target_commitish: ${{ github.sha }}
          name: JCM v${{ inputs.publish-tag }}
          prerelease: ${{ inputs.release-type == 'beta' }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-jars/*.jar
            jcm-native-sdk-*.zip
